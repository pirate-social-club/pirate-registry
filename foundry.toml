[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1024

[invariant]
runs = 64
depth = 256
fail_on_revert = false

# Development and differential testing only: Solar output never mixes with
# the solc release artifacts in out/ and cache/.
# FOUNDRY_PROFILE=solar forge test --use solar
[profile.solar]
out = "out-solar"
cache_path = "cache-solar"
